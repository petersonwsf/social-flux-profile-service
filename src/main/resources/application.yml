spring:
  application:
    name: profile-service
  datasource:
    # Banco PRÓPRIO do serviço (D2: um banco por serviço). Reaproveita, por padrão, as credenciais do authentication_service
    # (IDENTITY_DB_USER/IDENTITY_DB_PASSWORD) na mesma instância PostgreSQL; sobrescreva com PROFILE_DB_* se quiser um role próprio.
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/${PROFILE_DB_NAME:profile}}
    username: ${PROFILE_DB_USER:${IDENTITY_DB_USER:profile}}
    password: ${PROFILE_DB_PASSWORD:${IDENTITY_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false     # falhou após as tentativas -> fila de mensagens mortas (DLQ)
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    rabbit:
      enabled: false     # o serviço continua útil sem o broker (o outbox acumula); não derrube a readiness por isso
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Outbox/inbox/RabbitMQ compartilhados (libs/socialflux-events).
socialflux:
  events:
    enabled: ${PROFILE_EVENTS_ENABLED:true}
    exchange: ${EVENTS_EXCHANGE:socialflux.events}
    relay-interval: ${PROFILE_OUTBOX_INTERVAL:PT0.5S}
  # Mídia compartilhada (libs/socialflux-media): processamento dos avatares e armazenamento no RustFS.
  media:
    storage: ${PROFILE_MEDIA_STORAGE:s3}
    s3:
      endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
      region: ${RUSTFS_REGION:us-east-1}
      access-key: ${RUSTFS_ACCESS_KEY:}
      secret-key: ${RUSTFS_SECRET_KEY:}
    image:
      max-bytes: ${PROFILE_AVATAR_MAX_BYTES:5MB}
      max-pixels: ${PROFILE_AVATAR_MAX_PIXELS:16000000}
    max-concurrent-processing: ${PROFILE_MEDIA_MAX_CONCURRENT:4}

profile:
  security:
    # JWKS do authentication_service (chave pública). O serviço NUNCA conhece a chave privada.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:socialflux-api}
    service-audience: ${PROFILE_SERVICE_AUDIENCE:profile-service}
    clock-skew: ${JWT_CLOCK_SKEW:PT60S}
  # Origens permitidas em métodos não seguros. Vazio = a própria origem (via X-Forwarded-*).
  allowed-origins: ${PROFILE_ALLOWED_ORIGINS:}
  avatars:
    # Bucket PRIVADO no RustFS (criado pelo rustfs_init). A entrega continua pública por /media/avatars/{chave} (D8 do perfil).
    bucket: ${PROFILE_AVATAR_BUCKET:avatars}
